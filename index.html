<style>
  :root{
     --ink: #162033;
  --ink-soft: #667085;

  --bg-top: #121524;
  --bg-bot: #191D2D;

  --card: #FFFFFF;
  --line: #D9DEE8;

  --accent: #4F7CFF;
  --accent-soft: #EEF2FF;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    min-height:100vh;
    background: radial-gradient(120% 120% at 20% 0%, var(--bg-bot), var(--bg-top) 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 16px;
    font-family:'Inter', sans-serif;
  }

  .card{
    width: min(440px, 94vw);
    background: var(--card);
    border-radius: 20px;
    padding: 40px 32px 32px;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.55);
    animation: rise 0.6s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .avatar{
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #0A5250);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
  }

  .head{ text-align:center; margin-bottom: 28px; }

  h1{
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--ink);
  }

  .sub{
    margin-top: 6px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .links{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .link{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 15px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    text-decoration:none;
    color: var(--ink);
    transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }
  .link:hover, .link:focus-visible{
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px -12px rgba(14,124,123,0.35);
    outline:none;
  }

  .icon{
    width: 38px; height: 38px;
    border-radius: 9px;
    background: var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .icon svg{ width:18px; height:18px; stroke: var(--accent); }

  .link-text{ flex:1; min-width:0; }
  .link-title{ font-family:'Sora', sans-serif; font-weight:600; font-size: 14.5px; }
  .link-desc{ font-size: 12px; color: var(--ink-soft); margin-top: 1px; }

  .chev{ color: var(--ink-soft); flex-shrink:0; }
  .chev svg{ width:16px; height:16px; }

  footer{
    text-align:center;
    margin-top: 26px;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }
</style>
